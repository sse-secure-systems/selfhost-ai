services:
  vllm-server:
    image: vllm/vllm-openai:qwen38
    container_name: vllm
    restart: "no"

    expose:
      - "8000"

    shm_size: "16g"

    stop_grace_period: 2m

    ulimits:
      memlock: -1
      stack: 67108864

    # Single DGX Spark / GB10 with 128 GB unified memory.
    mem_limit: "100g"
    memswap_limit: "100g"

    gpus: all

    volumes:
      - ../../models/Qwen3.8-27B-NVFP4:/models/Qwen3.8-27B-NVFP4:ro

    env_file:
      - ../../.env

    environment:
      HF_HUB_OFFLINE: "1"
      # The Python frontend correctly parses this checkpoint's function XML.
      # The qwen38 Rust frontend returns it as plain text with qwen3_xml.
      VLLM_USE_RUST_FRONTEND: "0"

    # Spark recipe: https://build.nvidia.com/spark/vllm/instructions
    # The checkpoint mixes NVFP4 and FP8 layers; vLLM detects quantization
    # from its config. Do not force a uniform --quantization format.
    # Clear the image entrypoint because the command includes vllm serve.
    entrypoint: []
    command: >
      vllm serve /models/Qwen3.8-27B-NVFP4
      --served-model-name nvidia/Qwen3.8-27B-NVFP4
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.7
      --max-model-len 262144
      --max-num-seqs 8
      --max-num-batched-tokens 8192
      --enable-chunked-prefill
      --async-scheduling
      --enable-prefix-caching
      --load-format fastsafetensors
      --reasoning-parser qwen3
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 10m
      retries: 60

    networks:
      - internal

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    depends_on:
      vllm-server:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    mem_limit: "512m"
    memswap_limit: "512m"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
